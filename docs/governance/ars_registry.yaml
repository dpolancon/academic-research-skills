# ==============================================================================
# ARS Integrated Governance Registry (ars_registry.yaml)
# ==============================================================================
# Authoritative machine-readable registry combining ARS component ontology and
# capability ownership mappings.
#
# Schema: ars-governance-registry-v1.0
# Version: 1.3.0
# Last Updated: 2026-10-19 (Wave E Dissemination Architecture Reconciliation)
#
# Core Architectural Principles:
# 1. Components ("What exists?") and Capabilities ("What responsibility is owned?")
#    are strictly distinguished into two separate top-level sections.
# 2. current_implementation_type (executable packaging) != semantic_role (architectural meaning).
# 3. Runtime truth until Wave F: runtime_path and current_owner represent live executable
#    truth; target_path and target_owner represent architectural destinations only.
# 4. Strict capability monopoly: Exactly one canonical current owner per capability.
# 5. Deprecated aliases own zero canonical substantive capabilities.
# ==============================================================================

