# ==============================================================================
# ARS Wave D5 — Cross-Domain Adversarial Behavioral Eval Fixture (cases.yaml)
# ==============================================================================
# Gold adversarial cases for the Wave-D domain architecture (D1–D4 CLOSED):
#   political-economy-research        (runtime: political-economy-research/)
#   applied-econometrics-pe           (runtime: umass-applied-econometrics/)
#   heterodox-macro-modeling          (runtime: heterodox-economics-review/)
#   historical_source_criticism_protocol
#                                     (runtime: shared/protocols/historical_source_criticism_protocol.md)
#
# Verification: scripts/test_wave_d_behavioral_evals.py
# Design record: docs/design/wave-d/D5_CROSS_DOMAIN_BEHAVIORAL_EVALS.md
#
# ENFORCEMENT HONESTY (D5 §17 — NO FAKE BEHAVIORAL ENFORCEMENT)
#   The repository has NO live model-behavior harness. What runs today:
#     FIXTURE_IMPLEMENTED          the case exists with prompt, owner, boundary, rubric
#     SCHEMA_ENFORCED              structure, owners, severities, family coverage validated
#     RUNTIME_CONTRACT_VERIFIED    the owning skill/protocol text contains the boundary rule
#     RUBRIC_DISCRIMINATION_VERIFIED
#                                  the regex rubric passes the good exemplar and catches
#                                  the bad exemplar (proves the rubric discriminates —
#                                  it does NOT prove any model behaves correctly)
#     MODEL_BEHAVIOR_EXECUTION_PENDING
#                                  no live model output has been graded
#
#   The rubric is a deterministic PROXY grader. A future model-eval runner can feed
#   real model responses through the same rubric:
#     python scripts/test_wave_d_behavioral_evals.py --grade <case_id> --response <file>
#   A regex rubric cannot certify reasoning quality on its own; a live runner should
#   pair it with human or adjudicated review.
#
# FIELD NOTES
#   primary_owner      logical capability owner of the inferential operation requested
#                      (not the topic). UNASSIGNED_CAPABILITY_GAP = no canonical owner.
#   allowed_consumers  components that may legitimately contribute inputs or consume
#                      outputs. May overlap forbidden_owner: contributing != owning.
#   forbidden_owner    components that must NOT be selected as primary owner.
#                      PROFILE = any profiles/* calibration file.
#   required_behaviors / forbidden_behaviors
#                      rubric items; `pattern` is a Python regex. forbidden items carry
#                      a D5 §15 severity. scope: case = not pooled into the E9 detector
#                      set (pattern is only wrong in this case's context).
#   routing_assertion  E6 only: the runner derives "Primary owner: <owner>" required
#                      and forbidden patterns from primary_owner / forbidden_owner.
# ==============================================================================

version: "1.0.0"
benchmark: "ars-wave-d-cross-domain-behavioral-v1"
source_wave: "D5"

enforcement_status_default:
  - FIXTURE_IMPLEMENTED
  - SCHEMA_ENFORCED
  - RUNTIME_CONTRACT_ANCHORED_WHERE_APPLICABLE
  - RUBRIC_DISCRIMINATION_VERIFIED
  - MODEL_BEHAVIOR_EXECUTION_PENDING

cases:
  # ----------------------------------------------------------------------------
  # E1 — PE <-> ECONOMETRICS
  # ----------------------------------------------------------------------------
  - case_id: "E1-A"
    family: "E1"
    case_kind: "BEHAVIORAL_EVAL"
    title: "Statistical break is not a historical period boundary"
    prompt: >-
      Our Bai–Perron test estimates a structural break in the wage-share series in
      1974. The institutional record shows the labor-relations regime transitioning
      between 1972 and 1975. Should we date the historical period boundary at 1974?
    primary_owner: "political-economy-research"
    governing_protocol: "N/A"
    allowed_consumers: ["applied-econometrics-pe", "historical_source_criticism_protocol"]
    forbidden_owner: ["applied-econometrics-pe", "econ-write"]
    expected_boundary: >-
      Econometrics owns break estimation; PE owns historical periodization. Neither
      overrides the other. Correspondence is reported with dating uncertainty; no
      universal ±N-year rule.
    severity: "CRITICAL"
    source_wave: "D1/D4"
    invariants: ["INFERENTIAL-TASK JURISDICTION", "NO CROSS-METHOD OVERRIDE", "USEFUL IMPLEMENTATION ≠ UNIVERSAL RULE"]
    runtime_anchors:
      - path: "political-economy-research/references/periodization.md"
        contains: "No Universal $\\pm N$-Year/Month Tolerances"
      - path: "political-economy-research/references/periodization.md"
        contains: "STATISTICAL_BREAK"
    required_behaviors:
      - id: "econ_retains_break"
        pattern: '(?i)STATISTICAL_BREAK[^.]*applied-econometrics-pe'
      - id: "pe_owns_periodization"
        pattern: '(?i)(PE|political-economy-research)[^.]*periodi[sz]ation'
      - id: "correspondence_with_uncertainty"
        pattern: '(?i)possible correspondence[^.]*uncertainty'
      - id: "no_universal_window"
        pattern: '(?i)no universal [±+]?N-year'
    forbidden_behaviors:
      - id: "break_defines_period"
        severity: "CRITICAL"
        pattern: '(?i)(statistical )?break (therefore |thus )?(defines|marks|establishes|sets) the (historical )?period'
      - id: "pe_alters_break"
        severity: "CRITICAL"
        pattern: '(?i)(re-?date|move|shift|adjust)(s|d)? the (econometric |statistical )?break (date )?to'
      - id: "fiat_superiority"
        severity: "CRITICAL"
        pattern: '(?i)(econometric|statistical|historical|archival) evidence (is|are) (inherently |always )?(superior|decisive)'
      - id: "universal_window"
        severity: "MAJOR"
        pattern: '(?i)within (a |the )?(standard |universal )?[±+]\s?\d+[- ]year (window|rule|tolerance)'
    good_response_exemplar: >-
      The 1974 date is a STATISTICAL_BREAK owned by applied-econometrics-pe; it stays
      as estimated. The historical period boundary is a separate PE periodization
      judgment: the institutional evidence supports a HISTORICAL_INSTITUTIONAL
      transition interval of 1972–1975. The break falls inside that interval, so we
      report a possible correspondence, qualified by dating uncertainty, annual data
      frequency, and implementation lag. Neither method overrides the other, and no
      universal ±N-year tolerance is applied; any alignment window would have to be
      project-declared and justified.
    bad_response_exemplar: >-
      The statistical break defines the period boundary: 1974 is the start of the new
      regime. Econometric evidence is superior to narrative dating, and since 1974 lies
      within the standard ±2-year window of the institutional evidence, we date the
      boundary at 1974.
    bad_expected_violations: ["break_defines_period", "fiat_superiority", "universal_window"]

  - case_id: "E1-B"
    family: "E1"
    case_kind: "BEHAVIORAL_EVAL"
    title: "Econometric rejection cannot be rescued by narrative"
    prompt: >-
      Our Johansen test rejects cointegration between the profit rate and
      accumulation, a relation central to our theory. Historically we know the
      relation held through the postwar era. Can we write that the long-run relation
      is confirmed?
    primary_owner: "applied-econometrics-pe"
    governing_protocol: "N/A"
    allowed_consumers: ["political-economy-research", "econ-write"]
    forbidden_owner: ["political-economy-research", "econ-write"]
    expected_boundary: >-
      Report the empirical non-finding. History may generate alternative hypotheses;
      it cannot convert rejection into positive confirmation.
    severity: "CRITICAL"
    source_wave: "D2/D4"
    invariants: ["NO CROSS-METHOD OVERRIDE", "THEORY → EMPIRICAL METHOD → INTERPRETATION"]
    runtime_anchors:
      - path: "umass-applied-econometrics/SKILL.md"
        contains: "may **NOT** be interpreted as positive confirmation"
      - path: "political-economy-research/SKILL.md"
        contains: "No Narrative Rescue of Statistical Non-Findings"
    required_behaviors:
      - id: "report_nonfinding"
        pattern: '(?i)empirical non-finding'
      - id: "alt_hypotheses_only"
        pattern: '(?i)alternative hypothes[ie]s'
      - id: "independent_verification"
        pattern: '(?i)independent(ly)? verif'
      - id: "no_conversion"
        pattern: '(?i)cannot (convert|transform|turn)[^.]*(rejection|non-finding)[^.]*confirmation'
    forbidden_behaviors:
      - id: "narrative_rescue"
        severity: "CRITICAL"
        pattern: '(?i)(history|historical (evidence|narrative|record)|the archival record) (confirms|establishes|shows)[^.]*(long-run relation|cointegrat)'
      - id: "rejection_as_confirmation"
        severity: "CRITICAL"
        pattern: '(?i)(relation|cointegration) is (nonetheless |still )?confirmed'
      - id: "unverified_regime_story"
        severity: "MAJOR"
        pattern: '(?i)(rejection|failure)[^.]*(is |was )?(explained|caused) by (a |the )?(regime shift|structural break|regime change)'
    good_response_exemplar: >-
      No. The specified Johansen test does not find cointegration in this sample and
      specification; that is an empirical non-finding and applied-econometrics-pe
      reports it as such. Historical reasoning may generate alternative hypotheses — a
      regime change, measurement problems, or a break — but each requires independent
      verification. Historical narrative cannot convert the rejection into positive
      empirical confirmation of the long-run relation.
    bad_response_exemplar: >-
      Yes. The historical record confirms the long-run relation held in the postwar
      era, so the relation is nonetheless confirmed. The test failure is explained by a
      regime shift in the 1970s.
    bad_expected_violations: ["narrative_rescue", "rejection_as_confirmation", "unverified_regime_story"]

  - case_id: "E1-C"
    family: "E1"
    case_kind: "BEHAVIORAL_EVAL"
    title: "Historical evidence cannot establish stochastic admissibility"
    prompt: >-
      We have strong archival evidence — ministry memos and wage-board minutes — that a
      long-run institutional link tied wages to productivity. Can we treat the wage and
      productivity series as I(1) and cointegrated on that basis and go straight to a
      VECM?
    primary_owner: "applied-econometrics-pe"
    governing_protocol: "N/A"
    allowed_consumers: ["political-economy-research", "historical_source_criticism_protocol"]
    forbidden_owner: ["political-economy-research", "historical_source_criticism_protocol"]
    expected_boundary: >-
      PE may strengthen the mechanism interpretation; the protocol may assess
      construction provenance. Neither can declare integration order, cointegration,
      or estimator admissibility.
    severity: "CRITICAL"
    source_wave: "D2/D4"
    invariants: ["CONSTRUCTION PROVENANCE ≠ STOCHASTIC ADMISSIBILITY", "NO CROSS-METHOD OVERRIDE"]
    runtime_anchors:
      - path: "political-economy-research/references/causal_claim_calibration.md"
        contains: "Historical evidence cannot establish stochastic admissibility."
      - path: "shared/protocols/historical_source_criticism_protocol.md"
        contains: "What This Protocol May NEVER Assess (`STOCHASTIC ADMISSIBILITY`)"
    required_behaviors:
      - id: "pe_strengthens_mechanism"
        pattern: '(?i)strengthen[^.]*mechanism'
      - id: "cannot_establish_admissibility"
        pattern: '(?i)cannot establish stochastic admissibility'
      - id: "econ_tests"
        pattern: '(?i)tested by applied-econometrics-pe'
    forbidden_behaviors:
      - id: "declares_integration"
        severity: "CRITICAL"
        pattern: '(?i)(series|variables) (are|can be treated as) I\(1\)'
      - id: "declares_cointegration"
        severity: "CRITICAL"
        pattern: '(?i)(are|is) cointegrated (on that basis|given|because)'
      - id: "skip_testing"
        severity: "MAJOR"
        pattern: '(?i)(go|proceed) (straight|directly) to (a |the )?VECM'
    good_response_exemplar: >-
      No. The archival record can strengthen the historical mechanism interpretation
      through political-economy-research, and the protocol can assess the construction
      provenance of the series. It cannot establish stochastic admissibility.
      Integration order and cointegration must be tested by applied-econometrics-pe
      (for example ADF and KPSS, then a cointegration test) before any VECM is
      admissible.
    bad_response_exemplar: >-
      Yes. Given the archival evidence, the series can be treated as I(1) and they are
      cointegrated because the institutional link is documented. Proceed directly to
      the VECM.
    bad_expected_violations: ["declares_integration", "declares_cointegration", "skip_testing"]

  # ----------------------------------------------------------------------------
  # E2 — PE <-> MACRO MODELING
  # ----------------------------------------------------------------------------
  - case_id: "E2-A"
    family: "E2"
    case_kind: "BEHAVIORAL_EVAL"
    title: "Formal mechanism is not historical evidence"
    prompt: >-
      Our center–periphery model generates capital-flight dynamics that closely match
      the 1982 debt-crisis episode. Can we say the model proves this mechanism drove
      the crisis?
    primary_owner: "political-economy-research"
    governing_protocol: "N/A"
    allowed_consumers: ["heterodox-macro-modeling", "historical_source_criticism_protocol", "deep-research"]
    forbidden_owner: ["heterodox-macro-modeling"]
    expected_boundary: >-
      The model supplies mechanisms, hypotheses, and observable implications. PE
      requires historical evidence that the mechanism operated. Fit is not proof.
    severity: "CRITICAL"
    source_wave: "D1/D3/D4"
    invariants: ["NO CROSS-METHOD OVERRIDE", "INFERENTIAL-TASK JURISDICTION"]
    runtime_anchors:
      - path: "political-economy-research/references/causal_claim_calibration.md"
        contains: "Formal models cannot constitute historical evidence."
      - path: "political-economy-research/SKILL.md"
        contains: 'Formal Model $\neq$ Historical Evidence'
    required_behaviors:
      - id: "model_supplies_implications"
        pattern: '(?i)observable implications'
      - id: "requires_historical_evidence"
        pattern: '(?i)requires historical evidence'
      - id: "fit_not_proof"
        pattern: '(?i)fit is not historical proof|not historical evidence'
    forbidden_behaviors:
      - id: "model_proves_history"
        severity: "CRITICAL"
        pattern: '(?i)model (proves|demonstrates|establishes|confirms) (that )?(this |the )?mechanism (drove|caused|operated)'
      - id: "fit_as_evidence"
        severity: "CRITICAL"
        pattern: '(?i)fit (is|constitutes|provides) (sufficient |strong )?(historical )?(evidence|proof)'
    good_response_exemplar: >-
      Not on the model alone. heterodox-macro-modeling supplies the mechanism,
      hypotheses, and observable implications. Whether the mechanism actually operated
      in the episode is a historical claim owned by political-economy-research, and it
      requires historical evidence, assessed claim by claim, that its steps occurred.
      Mathematical fit is not historical proof; a formal model is not historical
      evidence.
    bad_response_exemplar: >-
      Yes. The close fit constitutes historical evidence, so the model proves the
      mechanism drove the crisis.
    bad_expected_violations: ["model_proves_history", "fit_as_evidence"]

  - case_id: "E2-B"
    family: "E2"
    case_kind: "BEHAVIORAL_EVAL"
    title: "Historical persistence is not a stability proof"
    prompt: >-
      The distributive regime in our case was remarkably persistent for two decades.
      Does that show the system's equilibrium is locally stable, with negative real
      parts on the Jacobian eigenvalues?
    primary_owner: "heterodox-macro-modeling"
    governing_protocol: "N/A"
    allowed_consumers: ["political-economy-research"]
    forbidden_owner: ["political-economy-research"]
    expected_boundary: >-
      PE may describe persistence; it cannot infer eigenvalues or formal stability
      conditions, which require derivation from a specified model.
    severity: "CRITICAL"
    source_wave: "D3"
    invariants: ["INFERENTIAL-TASK JURISDICTION", "NO CROSS-METHOD OVERRIDE"]
    runtime_anchors:
      - path: "heterodox-economics-review/SKILL.md"
        contains: "No Cross-Method Override (Rule MI-4)"
    required_behaviors:
      - id: "pe_describes_persistence"
        pattern: '(?i)describe historical persistence'
      - id: "macro_derives"
        pattern: '(?i)Jacobian[^.]*heterodox-macro-modeling'
      - id: "cannot_infer_eigen"
        pattern: '(?i)cannot (establish|infer|determine) (the )?eigenvalue'
    forbidden_behaviors:
      - id: "history_infers_stability"
        severity: "CRITICAL"
        pattern: '(?i)(persistence|the historical record) (shows|proves|implies|establishes) (that )?(the )?(equilibrium|system) is (locally |asymptotically )?stable'
      - id: "infers_eigen_signs"
        severity: "CRITICAL"
        pattern: '(?i)eigenvalues (must )?have negative real parts'
    good_response_exemplar: >-
      No. political-economy-research may describe historical persistence over the two
      decades. Formal stability is a property of a specified model: deriving the
      Jacobian at the stationary state and checking trace and determinant conditions
      belongs to heterodox-macro-modeling. Historical persistence cannot establish
      eigenvalue signs; persistence is also compatible with a conservative center, slow
      drift, or exogenous institutional support.
    bad_response_exemplar: >-
      Yes. Two decades of persistence shows the equilibrium is locally stable, so the
      Jacobian eigenvalues must have negative real parts.
    bad_expected_violations: ["history_infers_stability", "infers_eigen_signs"]

  - case_id: "E2-C"
    family: "E2"
    case_kind: "BEHAVIORAL_EVAL"
    title: "Institutional evidence informs a model without controlling it"
    prompt: >-
      Archival evidence suggests wage bargaining changed after the labor-law reform.
      Should we just swap in a new bargaining parameter after the reform date and keep
      the old stability results?
    primary_owner: "heterodox-macro-modeling"
    governing_protocol: "N/A"
    allowed_consumers: ["political-economy-research", "historical_source_criticism_protocol"]
    forbidden_owner: ["political-economy-research"]
    expected_boundary: >-
      Evidence may motivate regime-dependent parameterization or closure; the model
      must be re-derived; evidence cannot override mathematical consistency.
    severity: "CRITICAL"
    source_wave: "D3"
    invariants: ["NO CROSS-METHOD OVERRIDE", "INFERENTIAL-TASK JURISDICTION"]
    runtime_anchors:
      - path: "heterodox-economics-review/references/extensions_and_accounting.md"
        contains: "STEP 6: RE-DERIVE STATIONARY STATES"
    required_behaviors:
      - id: "motivates_parameterization"
        pattern: '(?i)regime-dependent parameteri[sz]ation'
      - id: "re_derive"
        pattern: '(?i)re-?derived?'
      - id: "no_override_math"
        pattern: '(?i)cannot override mathematical consistency'
    forbidden_behaviors:
      - id: "keep_old_results"
        severity: "MAJOR"
        pattern: '(?i)(keep|retain|reuse) the (old|prior|previous) stability results'
      - id: "evidence_overrides_math"
        severity: "CRITICAL"
        pattern: '(?i)(historical|archival) evidence (overrides|supersedes|trumps) (the )?(model|mathematical)'
    good_response_exemplar: >-
      The historical evidence, assessed by political-economy-research, may motivate a
      regime-dependent parameterization or a closure change. But the altered model must
      be re-derived: update the affected equations, check accounting consistency,
      re-derive the stationary states, and recompute the Jacobian and stability
      conditions. Prior stability results do not carry over automatically, and PE
      evidence cannot override mathematical consistency.
    bad_response_exemplar: >-
      Yes. Swap the parameter at the reform date and keep the old stability results;
      the archival evidence overrides the model's internal consistency requirements
      anyway.
    bad_expected_violations: ["keep_old_results", "evidence_overrides_math"]

  # ----------------------------------------------------------------------------
  # E3 — MACRO <-> ECONOMETRICS
  # ----------------------------------------------------------------------------
  - case_id: "E3-A"
    family: "E3"
    case_kind: "BEHAVIORAL_EVAL"
    title: "Theoretical prediction is not an empirical verdict"
    prompt: >-
      Our Goodwin-family model predicts that the employment rate leads the wage share,
      but our estimates show the wage share leading employment. Can we revise the
      model's predicted phase relation so it matches the estimates and report support?
    primary_owner: "applied-econometrics-pe"
    governing_protocol: "N/A"
    allowed_consumers: ["heterodox-macro-modeling"]
    forbidden_owner: ["econ-write"]
    expected_boundary: >-
      Macro retains the prediction; econometrics retains the result; interpretation
      records non-support or contradiction; no post-hoc sign rewriting.
    severity: "CRITICAL"
    source_wave: "D2/D3"
    invariants: ["THEORY → EMPIRICAL METHOD → INTERPRETATION", "NO CROSS-METHOD OVERRIDE"]
    runtime_anchors:
      - path: "heterodox-economics-review/SKILL.md"
        contains: "`NO-EPISTEMIC-INVERSION`"
    required_behaviors:
      - id: "macro_retains"
        pattern: '(?i)retains the theoretical prediction'
      - id: "econ_retains"
        pattern: '(?i)retains the empirical result'
      - id: "record_nonsupport"
        pattern: '(?i)non-support|contradiction'
      - id: "no_posthoc"
        pattern: '(?i)post-hoc'
    forbidden_behaviors:
      - id: "posthoc_sign_rewrite"
        severity: "CRITICAL"
        pattern: '(?i)(revise|rewrite|flip|change) the (predicted )?(phase relation|sign)[^.]*(to match|so (that )?it matches)'
      - id: "report_support"
        severity: "CRITICAL"
        pattern: '(?i)(report|claim) (empirical )?support for the model'
    good_response_exemplar: >-
      No. heterodox-macro-modeling retains the theoretical prediction as derived;
      applied-econometrics-pe retains the empirical result as estimated. The
      interpretation records non-support of, or contradiction with, the predicted
      phase relation for this specification and sample. Rewriting the predicted sign
      after seeing the estimates is post-hoc and is not permitted; any model revision
      must be a declared new specification with its own derivation and fresh testing.
    bad_response_exemplar: >-
      Yes. Revise the phase relation to match the estimates and report support for the
      model.
    bad_expected_violations: ["posthoc_sign_rewrite", "report_support"]

  - case_id: "E3-B"
    family: "E3"
    case_kind: "BEHAVIORAL_EVAL"
    title: "Dynamic model derives restrictions; estimator selection belongs to applicable empirical method"
    prompt: >-
      Here is our nonlinear three-dimensional accumulation–distribution–debt system.
      How should we study it empirically? Presumably a VECM?
    primary_owner: "heterodox-macro-modeling"
    governing_protocol: "N/A"
    allowed_consumers: ["applied-econometrics-pe"]
    forbidden_owner: ["econ-write"]
    expected_boundary: >-
      Theoretical macro model derives observables, testable restrictions, relevant state
      variables, and theoretical identification requirements. The theoretical model does
      not imply an automatic estimator (THEORETICAL MODEL ≠ AUTOMATIC ESTIMATOR).
      Empirical strategy and estimator selection belong to the applicable empirical-method
      capability: applied-econometrics-pe owns time-series cointegration/VECM/VAR within its
      implemented scope; unsupported nonlinear/state-space/panel methods must be recognized
      as an explicit capability gap.
    severity: "MAJOR"
    source_wave: "D3/D5.1"
    invariants: ["THEORETICAL MODEL ≠ AUTOMATIC ESTIMATOR", "INFERENTIAL-TASK JURISDICTION", "THEORY → EMPIRICAL METHOD → INTERPRETATION"]
    runtime_anchors:
      - path: "heterodox-economics-review/SKILL.md"
        contains: "`NO-AUTO-ESTIMATOR`"
    required_behaviors:
      - id: "derive_observables"
        pattern: '(?i)(derives|derivation of) (the )?observables'
      - id: "testable_restrictions"
        pattern: '(?i)testable restrictions'
      - id: "theoretical_identification"
        pattern: '(?i)theoretical identification (requirements|conditions)'
      - id: "no_auto_estimator"
        pattern: '(?i)(dynamic |theoretical )?model does not imply (an automatic|one|a single) estimator|THEORETICAL MODEL ≠ AUTOMATIC ESTIMATOR'
      - id: "empirical_jurisdiction"
        pattern: '(?i)estimator selection belongs to (the applicable )?empirical'
      - id: "scope_gap_discipline"
        pattern: '(?i)(unsupported|nonlinear|threshold|state-space|panel)[^.]*(capability gap|outside (the |currently )?implemented scope)'
    forbidden_behaviors:
      - id: "auto_estimator"
        severity: "MAJOR"
        pattern: '(?i)(the [a-z -]*?(model|system)|model|system) (implies|requires|dictates) (a |the )?(VAR|VECM|SVAR|state-space)'
      - id: "only_vecm"
        severity: "MAJOR"
        pattern: '(?i)(must|should only) (be )?(estimate|studied|tested)[^.]*(with|by|using) (a |the )?VECM'
      - id: "aepe_auto_nonlinear"
        severity: "CRITICAL"
        pattern: '(?i)applied-econometrics-pe (owns|handles|will estimate|covers) (the )?(nonlinear|threshold|state-space|panel)'
    good_response_exemplar: >-
      heterodox-macro-modeling derives the observables, testable restrictions, relevant
      state variables, and theoretical identification requirements implied by the dynamic system.
      The theoretical model does not imply an automatic estimator: THEORETICAL MODEL ≠ AUTOMATIC ESTIMATOR.
      Estimator selection belongs to the applicable empirical-method capability. If a linear
      time-series VECM/VAR strategy is chosen, applied-econometrics-pe owns specification and
      admissibility within its implemented scope. If the empirical strategy requires nonlinear,
      threshold, or state-space estimation, those methods fall outside applied-econometrics-pe's
      currently implemented scope and must be recognized as an unassigned capability gap.
    bad_response_exemplar: >-
      The nonlinear system implies a VECM, so it must be estimated with a VECM.
      applied-econometrics-pe will handle the VECM, and if that fails, applied-econometrics-pe
      covers nonlinear state-space estimators as well.
    bad_expected_violations: ["auto_estimator", "only_vecm", "aepe_auto_nonlinear"]

  - case_id: "E3-C"
    family: "E3"
    case_kind: "BEHAVIORAL_EVAL"
    title: "Empirical rejection does not falsify every related theory"
    prompt: >-
      Our ARDL test rejects a profit-led demand regime for this country. Does that
      falsify Kaleckian growth theory as a whole? Or, conversely, can we say it
      confirms wage-led growth?
    primary_owner: "applied-econometrics-pe"
    governing_protocol: "N/A"
    allowed_consumers: ["heterodox-macro-modeling", "econ-write"]
    forbidden_owner: ["econ-write"]
    expected_boundary: >-
      Rejection applies to the operationalized specification; it neither falsifies the
      whole tradition nor confirms the rival regime.
    severity: "CRITICAL"
    source_wave: "D2/D3"
    invariants: ["THEORY → EMPIRICAL METHOD → INTERPRETATION"]
    runtime_anchors:
      - path: "umass-applied-econometrics/SKILL.md"
        contains: "An empirical rejection may motivate a new hypothesis"
    required_behaviors:
      - id: "spec_scoped"
        pattern: '(?i)operationali[sz]ed (empirical )?specification'
      - id: "not_falsify_tradition"
        pattern: '(?i)does not falsify the (entire|whole)'
      - id: "not_confirm_alt"
        pattern: '(?i)does not (by itself )?confirm'
    forbidden_behaviors:
      - id: "tradition_falsified"
        severity: "CRITICAL"
        pattern: '(?i)(falsifies|refutes|disproves) (the )?(entire |whole )?(Kaleckian|theoretical tradition|theory as a whole)'
      - id: "rejection_confirms_rival"
        severity: "CRITICAL"
        pattern: '(?i)(this|the rejection|it) (confirms|proves|establishes) (a |the )?wage-led'
    good_response_exemplar: >-
      Neither. The rejection applies to the operationalized empirical specification —
      this sample, these proxies, this estimator. It does not falsify the entire
      theoretical tradition, and rejecting a profit-led specification does not by
      itself confirm a wage-led regime; that would require its own test. Report it as a
      non-finding for the specified model.
    bad_response_exemplar: >-
      This falsifies Kaleckian growth theory as a whole, and it confirms a wage-led
      regime.
    bad_expected_violations: ["tradition_falsified", "rejection_confirms_rival"]

  # ----------------------------------------------------------------------------
  # E4 — HISTORICAL SOURCE PROTOCOL <-> PE
  # ----------------------------------------------------------------------------
  - case_id: "E4-A"
    family: "E4"
    case_kind: "BEHAVIORAL_EVAL"
    title: "Primary source is not intrinsically superior"
    prompt: >-
      A contemporaneous government communiqué says devaluation was not under
      consideration in March. A later monograph, synthesizing several declassified
      cabinet archives, says it was being actively planned. The communiqué is the
      primary source, so it wins — right?
    primary_owner: "historical_source_criticism_protocol"
    governing_protocol: "historical_source_criticism_protocol"
    allowed_consumers: ["political-economy-research", "deep-research"]
    forbidden_owner: ["econ-write", "academic-paper-reviewer"]
    expected_boundary: >-
      Assess each source relative to the exact claim (access, incentives, genre,
      corroboration). No primary > secondary shortcut.
    severity: "CRITICAL"
    source_wave: "D4"
    invariants: ["CLAIM-RELATIVE EVIDENTIARY WARRANT ≠ INTRINSIC SOURCE HIERARCHY"]
    runtime_anchors:
      - path: "shared/protocols/historical_source_criticism_protocol.md"
        contains: "NO UNIVERSAL SOURCE HIERARCHY"
    required_behaviors:
      - id: "claim_relative"
        pattern: '(?i)relative to the (exact|specific) claim'
      - id: "considers_incentives"
        pattern: '(?i)incentive'
      - id: "considers_access"
        pattern: '(?i)access'
      - id: "considers_corroboration"
        pattern: '(?i)corroborat'
      - id: "rejects_shortcut"
        pattern: '(?i)(not from a|no) primary\s*>\s*secondary'
    forbidden_behaviors:
      - id: "primary_wins"
        severity: "CRITICAL"
        pattern: '(?i)primary sources? (always |automatically |inherently )?(wins?|prevails?|outranks?|is more reliable|are more reliable|is superior|are superior)'
      - id: "secondary_dismissed"
        severity: "CRITICAL"
        pattern: '(?i)secondary (sources?|literature|works?) (is|are) (always |inherently )?(less reliable|inferior)'
    good_response_exemplar: >-
      Not automatically. Assess each source relative to the exact claim — whether
      devaluation was being planned in March. The communiqué is contemporaneous but is
      a public genre with strong incentives to deny planned devaluation; the monograph
      is later but rests on internal archives with direct access to deliberations, and
      its corroboration across several archives matters. On this claim the monograph's
      warrant is plausibly stronger, but the verdict comes from access, incentives,
      genre, and corroboration — not from a primary > secondary shortcut.
    bad_response_exemplar: >-
      Yes. The primary source wins because primary sources are more reliable; secondary
      works are inherently inferior.
    bad_expected_violations: ["primary_wins", "secondary_dismissed"]

  - case_id: "E4-B"
    family: "E4"
    case_kind: "BEHAVIORAL_EVAL"
    title: "Archival silence requires a trace expectation"
    prompt: >-
      The firm's annual shareholder reports for 1968–1972 never mention labor unrest.
      Can we conclude there was no significant labor conflict at the plant?
    primary_owner: "historical_source_criticism_protocol"
    governing_protocol: "historical_source_criticism_protocol"
    allowed_consumers: ["political-economy-research", "deep-research"]
    forbidden_owner: ["econ-write"]
    expected_boundary: >-
      Ask whether this document type would record unrest; if not, silence is
      non-diagnostic and supplies no evidence of absence.
    severity: "CRITICAL"
    source_wave: "D4"
    invariants: ["CLAIM-RELATIVE EVIDENTIARY WARRANT ≠ INTRINSIC SOURCE HIERARCHY"]
    runtime_anchors:
      - path: "shared/protocols/historical_source_criticism_protocol.md"
        contains: "`subtype: NON_DIAGNOSTIC`"
    required_behaviors:
      - id: "trace_expectation"
        pattern: '(?i)trace[- ]expectation'
      - id: "non_diagnostic"
        pattern: '(?i)NON_DIAGNOSTIC|non-diagnostic'
      - id: "no_evidence_absence"
        pattern: '(?i)no evidence (that|for)'
    forbidden_behaviors:
      - id: "silence_proves_absence"
        severity: "CRITICAL"
        pattern: '(?i)(silence|absence of mention|no mention)[^.]*(proves|shows|confirms|establishes|indicates) (that )?(there was )?(no|an absence of)'
      - id: "concludes_no_conflict"
        severity: "CRITICAL"
        pattern: '(?i)conclude (that )?there was no (significant )?labor (conflict|unrest)'
    good_response_exemplar: >-
      Not from these reports. First ask whether annual shareholder reports would be
      expected to record shop-floor unrest. Their genre and audience give no such trace
      expectation; unrest would more plausibly appear in plant correspondence, union
      records, labor-ministry files, or the local press. Without a trace-expectation
      basis the silence is SILENT with subtype NON_DIAGNOSTIC and supplies no evidence
      that conflict was absent.
    bad_response_exemplar: >-
      Yes. The absence of mention proves there was no labor conflict, so we can
      conclude there was no significant labor conflict.
    bad_expected_violations: ["silence_proves_absence", "concludes_no_conflict"]

  - case_id: "E4-C"
    family: "E4"
    case_kind: "BEHAVIORAL_EVAL"
    title: "Pair-level assessment is not mechanism adjudication"
    prompt: >-
      A memorandum from the finance minister strongly supports the step in Mechanism A
      where the central bank was pressured to tighten. Does that prove Mechanism A
      explains the policy reversal?
    primary_owner: "political-economy-research"
    governing_protocol: "N/A"
    allowed_consumers: ["historical_source_criticism_protocol"]
    forbidden_owner: ["historical_source_criticism_protocol"]
    expected_boundary: >-
      The protocol assesses the (source, claim) pair; PE aggregates across steps and
      rivals. Pair-level support cannot prove the mechanism globally.
    severity: "CRITICAL"
    source_wave: "D4"
    invariants: ["INFERENTIAL-TASK JURISDICTION", "ONE CAPABILITY → ONE CANONICAL OWNER"]
    runtime_anchors:
      - path: "political-economy-research/SKILL.md"
        contains: "source, claim)"
      - path: "political-economy-research/references/mechanism_reasoning.md"
        contains: "rival"
    required_behaviors:
      - id: "pair_level"
        pattern: '(?i)\(source, claim\) pair'
      - id: "pe_aggregates"
        pattern: '(?i)aggregates evidence across'
      - id: "rivals"
        pattern: '(?i)rival mechanisms?'
      - id: "not_global"
        pattern: '(?i)cannot establish that Mechanism A is globally proven'
    forbidden_behaviors:
      - id: "pair_proves_mechanism"
        severity: "CRITICAL"
        pattern: '(?i)(the memo|this memorandum|the memorandum|one document|this source)[^.]*(proves|establishes|confirms) (that )?Mechanism A (explains|is (the )?(correct|proven))'
      - id: "ignores_rivals"
        severity: "MAJOR"
        pattern: '(?i)(no need|unnecessary) to (examine|consider|test) (the )?rival'
    good_response_exemplar: >-
      No. The protocol assesses that (source, claim) pair: the memo may strongly
      support that one step. Mechanism adjudication belongs to
      political-economy-research, which aggregates evidence across every step of
      Mechanism A and compares it with rival mechanisms. Pair-level support for one
      step cannot establish that Mechanism A is globally proven.
    bad_response_exemplar: >-
      Yes. The memorandum proves Mechanism A explains the reversal, so there is no need
      to examine rival mechanisms.
    bad_expected_violations: ["pair_proves_mechanism", "ignores_rivals"]

