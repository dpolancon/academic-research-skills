      - id: "checklist_not_required"
        pattern: '(?i)checklist is not required'
    forbidden_behaviors:
      - id: "full_checklist"
        severity: "MAJOR"
        pattern: '(?i)(must|need to|should) (write out|complete|fill in|document|assess) all (fourteen|14)'
      - id: "skip_assessment"
        severity: "MAJOR"
