  # ----------------------------------------------------------------------------
  - case_id: "E5-A"
    family: "E5"
    case_kind: "BEHAVIORAL_EVAL"
    title: "Process tracing without Van Evera labels"
    prompt: >-
      Our chapter does qualitative process tracing — we state each mechanism step, the
      expected traces, and how evidence discriminates between rivals — but we never use
      the hoop / smoking-gun vocabulary. Is the process tracing deficient?
    primary_owner: "political-economy-research"
    governing_protocol: "N/A"
    allowed_consumers: ["historical_source_criticism_protocol"]
    forbidden_owner: ["academic-paper-reviewer"]
    expected_boundary: "PASS. The vocabulary is supported, not required."
    severity: "MAJOR"
    source_wave: "D4"
    invariants: ["CAPABILITY SUPPORT ≠ UNIVERSAL APPLICATION REQUIREMENT"]
    runtime_anchors:
      - path: "political-economy-research/references/mechanism_reasoning.md"
        contains: "OPTIONAL VOCABULARY — NOT MANDATORY SERIALIZATION"
    required_behaviors:
      - id: "labels_optional"
        pattern: '(?i)optional vocabulary'
      - id: "passes_without"
        pattern: '(?i)passes without them|is not deficient'
      - id: "mandatory_obligation_named"
        pattern: '(?i)diagnosticity'
    forbidden_behaviors:
      - id: "labels_mandatory"
        severity: "MAJOR"
        pattern: '(?i)(must|should|needs? to) (use|adopt|apply|label)[^.]*(hoop|smoking-gun|Van Evera)'
      - id: "deficient"
        severity: "MAJOR"
        pattern: '(?i)(is|remains) deficient (without|because)'
    good_response_exemplar: >-
      No. Mechanism-step specification, expected traces, rival comparison, and
      qualitative diagnosticity are the mandatory reasoning obligations. Van Evera
      labels are supported as optional vocabulary, not required serialization; the
      analysis passes without them.
    bad_response_exemplar: >-
      Yes, it is deficient without the labels. You must label each test as hoop,
      smoking-gun, straw-in-the-wind, or doubly-decisive.
    bad_expected_violations: ["labels_mandatory", "deficient"]

  - case_id: "E5-B"
    family: "E5"
    case_kind: "BEHAVIORAL_EVAL"
    title: "SFC without portfolio choice"
    prompt: >-
      Our simple SFC model has households holding a single financial asset (deposits)
      with no endogenous asset allocation. Do we need to impose Brainard–Tobin
      adding-up restrictions?
    primary_owner: "heterodox-macro-modeling"
    governing_protocol: "N/A"
    allowed_consumers: []
    forbidden_owner: ["applied-econometrics-pe"]
    expected_boundary: >-
      SFC core (balance-sheet and transaction-flow consistency) is required;
      Brainard–Tobin restrictions are conditional and not mandatory here.
    severity: "MAJOR"
    source_wave: "D3/D3.1"
    invariants: ["CAPABILITY SUPPORT ≠ UNIVERSAL APPLICATION REQUIREMENT"]
    runtime_anchors:
      - path: "heterodox-economics-review/references/extensions_and_accounting.md"
        contains: "Not required in single-asset or fixed-financing SFC models."
    required_behaviors:
      - id: "core_required"
        pattern: '(?i)balance-sheet consistency'
      - id: "tf_required"
        pattern: '(?i)transactions?-flow consistency'
      - id: "bt_conditional"
        pattern: '(?i)(apply|applies) only when'
      - id: "not_mandatory"
        pattern: '(?i)not mandatory'
    forbidden_behaviors:
      - id: "bt_mandatory"
        severity: "MAJOR"
        pattern: '(?i)(must|always|need to) (impose|include|satisfy) (the )?Brainard'
      - id: "drops_core"
        severity: "CRITICAL"
        pattern: '(?i)(consistency|stock-flow) (checks? )?(is|are) (not required|optional|unnecessary)'
    good_response_exemplar: >-
      No. The universal SFC core is required: balance-sheet consistency,
      transactions-flow consistency, sectoral budget constraints, and stock-flow
      reconciliation. Brainard–Tobin portfolio restrictions are conditional: they apply
      only when there are multiple assets with endogenous portfolio allocation, so they
      are not mandatory for this single-asset model.
    bad_response_exemplar: >-
      Yes. Every SFC model must impose Brainard–Tobin adding-up restrictions; with a
      single asset, stock-flow consistency checks are optional.
    bad_expected_violations: ["bt_mandatory", "drops_core"]

  - case_id: "E5-C"
    family: "E5"
    case_kind: "BEHAVIORAL_EVAL"
    title: "Dynamic model without Hopf analysis"
    prompt: >-
      We have a linear two-dimensional model with constant parameters and no
      bifurcation parameter of interest. At the equilibrium the trace is negative and
      the determinant positive. Do we need a Hopf bifurcation analysis?
    primary_owner: "heterodox-macro-modeling"
    governing_protocol: "N/A"
    allowed_consumers: []
    forbidden_owner: ["applied-econometrics-pe"]
    expected_boundary: "Local stability analysis is appropriate; Hopf analysis is not required."
    severity: "MAJOR"
    source_wave: "D3"
    invariants: ["CAPABILITY SUPPORT ≠ UNIVERSAL APPLICATION REQUIREMENT"]
    runtime_anchors:
      - path: "heterodox-economics-review/references/dynamic_systems_and_stability.md"
        contains: "Do **not** invoke high-dimensional machinery"
    required_behaviors:
      - id: "local_stability"
        pattern: '(?i)local stability analysis is appropriate'
      - id: "hopf_not_required"
        pattern: '(?i)Hopf analysis is not required'
    forbidden_behaviors:
      - id: "hopf_mandatory"
        severity: "MAJOR"
        pattern: '(?i)(must|always|need to) (perform|conduct|include|run) (a )?Hopf'
      - id: "overkill_machinery"
        severity: "MINOR"
        pattern: '(?i)(run|apply) Routh.Hurwitz'
    good_response_exemplar: >-
      No. Local stability analysis is appropriate: with trace negative and determinant
      positive at the equilibrium, the linear system is asymptotically stable. With no
      bifurcation parameter there is nothing for a Hopf analysis to vary, so Hopf
      analysis is not required.
    bad_response_exemplar: >-
      Yes. Every dynamic model must include a Hopf bifurcation analysis, and you should
      also run Routh–Hurwitz checks.
    bad_expected_violations: ["hopf_mandatory", "overkill_machinery"]

